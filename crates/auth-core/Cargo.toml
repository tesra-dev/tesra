[package]
name = "tesra-auth-core"
description = "Framework-agnostic authentication core mapped to OWASP ASVS 5.0: policies, passwords, sessions, MFA, passkeys, OIDC and audit events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["common-passwords", "memory-store"]
# Embeds a list of ~40k common passwords so the blocklist check works offline.
common-passwords = []
# An in-memory session store, for tests and single-process deployments.
memory-store = []

[dependencies]
argon2.workspace = true
base64ct.workspace = true
rand.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["serde"] }
tracing.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
